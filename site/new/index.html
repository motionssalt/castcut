<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>CastCut — New Project</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="prefetch" href="/common.js">
</head>
<body>
<header class="topbar">
  <div class="brand"><a href="/" style="color:inherit; text-decoration:none;">🎬 CastCut</a> <span class="dim" id="whoami"></span></div>
  <button id="btnLogout" class="btn ghost sm" hidden>Sign out</button>
</header>

<main id="app">
  <!-- ============ GATE ============ -->
  <section id="gate" hidden>
    <div class="card">
      <h2>Sign in</h2>
      <p class="dim">Private tool. Paste the owner's GitHub PAT. It stays in this browser only.</p>
      <input id="patInput" class="field" type="password" placeholder="Paste the GitHub PAT" autocomplete="off" spellcheck="false">
      <button id="btnLogin" class="btn primary block">Unlock</button>
      <p id="gateErr" class="err"></p>
    </div>
  </section>

  <!-- ============ NEW PROJECT CONTENT ============ -->
  <section id="pageContent" hidden>
    <div class="crumb-bar" style="margin-bottom: 14px;">
      <a href="/" class="crumb-link">← All Projects</a>
      <span class="dim">/</span>
      <span class="crumb-title">New Project</span>
    </div>

    <div class="card">
      <h2>Create New Project</h2>
      <p class="dim sm">Process anime footage without downloading multi-gigabyte videos on mobile.</p>

      <div style="margin-top: 14px;">
        <label class="lbl">Project Title (optional)</label>
        <input id="projectTitle" class="field" type="text" placeholder="e.g. Code Geass Episode 25" autocomplete="off">
      </div>

      <div style="margin-top: 14px;">
        <label class="lbl">1. Video link (direct URL, Google Drive, or magnet)</label>
        <input id="srcUrl" class="field" type="text" placeholder="Paste video URL, Google Drive link, or magnet link..." autocomplete="off">
      </div>

      <div style="margin: 14px 0; text-align: center;" class="dim sm">— OR —</div>

      <div>
        <label class="lbl">2. Torrent file</label>
        <button type="button" id="btnPickTorrent" class="btn ghost block">Choose .torrent file</button>
        <input id="srcFile" type="file" accept=".torrent,application/x-bittorrent" hidden>
        
        <div id="torrentSelectedInfo" class="torrent-selected-row" hidden>
          <span id="torrentSelectedName" class="sm mono"></span>
          <button type="button" id="btnRemoveTorrent" class="btn danger sm">✕ Remove</button>
        </div>
        <p id="torrentErr" class="err"></p>

        <div id="newJobFiles" hidden style="margin-top: 10px;">
          <div class="torrent-header-card">
            <div class="th-label">Torrent:</div>
            <div class="expandable-text" id="newJobTorrentName"></div>
          </div>
          <div id="newJobFileList" class="filelist" style="max-height: 200px; overflow-y: auto; margin-top: 6px; border: 1px solid #30363d; border-radius: 6px;"></div>
        </div>
      </div>

      <div class="content-type-wrap" style="margin-top: 16px;">
        <span class="dim sm">Content Type:</span>
        <div class="content-type-toggle">
          <label class="ct-label">
            <input type="radio" name="contentType" value="anime" checked>
            <span class="ct-pill">Anime</span>
          </label>
          <label class="ct-label">
            <input type="radio" name="contentType" value="irl">
            <span class="ct-pill">Live-Action (IRL)</span>
          </label>
        </div>
      </div>

      <p id="startErr" class="err" style="margin-top: 10px;"></p>

      <button id="btnStart" class="btn primary block" style="margin-top: 16px;" disabled>
        Start Project →
      </button>
    </div>
  </section>
</main>

<script src="/common.js"></script>
<script src="/new/new.js"></script>
</body>
</html>
