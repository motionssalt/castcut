<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Finished Exports — CastCut</title>
  <meta name="description" content="CastCut rendered video exports and downloads." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="authGate" hidden></div>

  <div id="appContent">
    <header class="top-bar">
      <div class="top-bar-left">
        <a href="/" class="brand-wordmark">
          <span class="brand-dot"></span>
          <span>CastCut</span>
        </a>
        <span class="page-title-crumb">Exports</span>
      </div>
      <div class="top-bar-right">
        <a id="btnBackToProject" href="#" class="btn btn-ghost btn-sm">
          ← Project
        </a>
      </div>
    </header>

    <main class="container" style="padding-top: 16px; padding-bottom: 40px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;">
        <div>
          <h1 style="font-size: 1.375rem; font-weight: 700;">Finished Exports</h1>
          <p id="exportsSubtitle" style="font-size: 0.8125rem; color: var(--text-secondary); margin-top: 2px;">
            Loading video exports…
          </p>
        </div>
        <button id="btnRefreshExports" class="btn btn-ghost btn-sm">
          ↻ Refresh
        </button>
      </div>

      <!-- Active Export Running Banner -->
      <div id="activeExportBanner" class="card" style="border-color: var(--accent); background-color: var(--accent-surface); margin-bottom: 16px;" hidden>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="spinner" style="color: var(--accent);"></span>
          <div>
            <div style="font-weight: 600; font-size: 0.9375rem; color: var(--accent-text);">Export in Progress</div>
            <div id="activeExportMsg" style="font-size: 0.8125rem; color: var(--text-secondary); margin-top: 2px;">
              Rendering cut video on GitHub Actions runner…
            </div>
          </div>
        </div>
      </div>

      <!-- Exports List -->
      <div id="exportsList">
        <div class="card skeleton" style="height: 110px; margin-bottom: 12px;"></div>
        <div class="card skeleton" style="height: 110px;"></div>
      </div>

      <!-- Empty State -->
      <div id="exportsEmpty" class="card" style="text-align: center; padding: 48px 20px;" hidden>
        <div style="font-size: 2rem; margin-bottom: 10px;">📦</div>
        <h2 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 6px;">No exports yet</h2>
        <p style="font-size: 0.875rem; color: var(--text-secondary); max-width: 380px; margin: 0 auto 18px auto;">
          Run an export from the Faces Flow or AI Scene Flow to generate video cuts.
        </p>
        <div style="display: flex; justify-content: center; gap: 8px;">
          <a id="btnGoFaces" href="#" class="btn btn-primary btn-sm">🙂 Faces Flow</a>
          <a id="btnGoScene" href="#" class="btn btn-secondary btn-sm">🎞 Scene Flow</a>
        </div>
      </div>
    </main>

    <!-- Mobile Bottom Thumb Navigation -->
    <nav class="bottom-nav">
      <a href="/" class="bottom-tab" aria-label="Projects">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
        <span>Projects</span>
      </a>
      <a href="/new/" class="bottom-tab" aria-label="New Project">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
        <span>New</span>
      </a>
      <a id="bottomTabFaces" href="#" class="bottom-tab" aria-label="Faces Flow">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>Faces</span>
      </a>
      <a id="bottomTabScene" href="#" class="bottom-tab" aria-label="AI Scene Flow">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" /></svg>
        <span>Scene</span>
      </a>
      <a href="/exports/" class="bottom-tab active" aria-label="Finished Exports">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
        <span>Exports</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/exports.js"></script>
</body>
</html>
