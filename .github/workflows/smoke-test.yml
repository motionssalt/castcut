name: Smoke Test — Job Creation and Intake

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: "Intake test to run"
        required: true
        type: choice
        default: "direct_url"
        options:
          - direct_url
          - all

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2

      - name: Install Python dependencies
        run: |
          python -m pip install -q requests

      - name: Run smoke test script
        run: python scripts/smoke_test.py --type "${{ inputs.test_type }}"
