name: Mode 1 — Clips export
run-name: clips-export — ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }

permissions:
  contents: write

concurrency:
  group: castcut-clips-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg aria2
          python -m pip install -q requests

      - name: Status — exporting
        run: |
          python -m pipeline.status "${{ inputs.job_id }}" --state clips_exporting \
            --message "Building ordered character cut and running final compression" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ inputs.job_id }}/"
          git commit -m "castcut: clips exporting ${{ inputs.job_id }}" || true
          for i in 1 2 3; do git push && break; git pull --rebase --autostash; sleep 2; done

      - name: Fetch source (release, or re-download when excluded)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p work
          df -h .
          python -m pipeline.refetch "${{ inputs.job_id }}" --release-tag "castcut-${{ inputs.job_id }}"

      - name: Export
        run: python -m pipeline.clips_export "${{ inputs.job_id }}"

      - name: Check final output fits the release limit
        env:
          CASTCUT_RELEASE_LIMIT_BYTES: ${{ vars.CASTCUT_RELEASE_LIMIT_BYTES }}
        run: python -m pipeline.release_size --check 'work/castcut-clips-*.mp4'

      - name: Upload final video to release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "castcut-${{ inputs.job_id }}" work/castcut-clips-*.mp4 --clobber

      - name: Status — done
        if: success()
        run: |
          python -m pipeline.status "${{ inputs.job_id }}" --state clips_ready \
            --message "Final clips file ready. Download from the release." \
            --set-json "$(cat jobs/${{ inputs.job_id }}/clips/export.json)"
          git add "jobs/${{ inputs.job_id }}/"
          git commit -m "castcut: clips ready ${{ inputs.job_id }}" || true
          for i in 1 2 3; do git push && break; git pull --rebase --autostash; sleep 2; done

      - name: Status — failed
        if: failure()
        run: |
          python -m pipeline.status "${{ inputs.job_id }}" --state clips_failed \
            --message "Clips export failed; see workflow log."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ inputs.job_id }}/"
          git commit -m "castcut: clips failed ${{ inputs.job_id }}" || true
          for i in 1 2 3; do git push && break; git pull --rebase --autostash; sleep 2; done

      - name: Status — cancelled
        if: cancelled()
        run: |
          prev=$(python -c "import json;print(json.load(open('jobs/${{ inputs.job_id }}/status.json')).get('state',''))" 2>/dev/null || true)
          python -m pipeline.status "${{ inputs.job_id }}" --state cancelled \
            --message "Run cancelled." --set-json "{\"cancelled_from\":\"$prev\"}" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add "jobs/${{ inputs.job_id }}/"
          git commit -m "castcut: cancelled ${{ inputs.job_id }}" || true
          for i in 1 2 3; do git push && break; git pull --rebase --autostash; sleep 2; done
