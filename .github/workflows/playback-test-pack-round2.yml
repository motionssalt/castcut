name: Phone playback compatibility test pack — Round 2
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playback-test-pack-round2
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLIPFORGE_READ_TOKEN: ${{ secrets.CLIPFORGE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q requests

      - name: Build publish and verify phone test pack round 2
        run: python -m pipeline.playback_pack_round2 --publish

      - name: Commit updated BUILD_STATE
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f BUILD_STATE.json ]; then
            git add BUILD_STATE.json
            git commit -m "Record published phone compatibility pack round 2 in BUILD_STATE.json" || true
            git push origin main || true
          fi

      - name: Preserve test diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-playback-round2-diagnostics-${{ github.run_id }}
          path: |
            work/playback-pack-round2/*.json
            work/playback-pack-round2/*.txt
            BUILD_STATE.json
