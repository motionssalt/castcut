name: Mode 2 — Scene export
run-name: scene-export — ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      export_id: { required: false, type: string, default: "" }
      audio_track: { required: false, type: string, default: "" }

permissions:
  contents: write

concurrency:
  group: castcut-sceneexport-${{ inputs.job_id }}-${{ inputs.export_id || 'default' }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg aria2
          python -m pip install -q requests

      - name: Status — exporting
        run: |
          python -m pipeline.status "${{ inputs.job_id }}" --state scene_exporting \
            --message "Cutting at full quality and joining with hard cuts" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -m pipeline.sync_job "${{ inputs.job_id }}"

      - name: Fetch source (release, or re-download when excluded)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p work
          df -h .
          python -m pipeline.refetch "${{ inputs.job_id }}" --release-tag "castcut-${{ inputs.job_id }}"

      - name: Export
        run: |
          cmd=(python -m pipeline.scene_export "${{ inputs.job_id }}")
          if [ -n "${{ inputs.export_id }}" ]; then cmd+=(--export-id "${{ inputs.export_id }}"); fi
          if [ -n "${{ inputs.audio_track }}" ]; then cmd+=(--audio-track "${{ inputs.audio_track }}"); fi
          "${cmd[@]}" 

      - name: Verify export playback compatibility and bitrate
        run: python -m pipeline.verify_export work/castcut-*.mp4

      - name: Check final output fits the release limit
        env:
          CASTCUT_RELEASE_LIMIT_BYTES: ${{ vars.CASTCUT_RELEASE_LIMIT_BYTES }}
        run: python -m pipeline.release_size --check work/castcut-*.mp4

      - name: Upload final to release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          out_file=$(find work -maxdepth 1 -name "castcut-*.mp4" | head -n 1)
          target_tag=$(python -m pipeline.releases --project-id "${{ inputs.job_id }}" --asset "$out_file")
          echo "Target release tag: $target_tag"
          gh release upload "$target_tag" "$out_file" --clobber
          echo "TARGET_RELEASE_TAG=$target_tag" >> "$GITHUB_ENV"

      - name: Status — done
        if: success()
        run: |
          python -m pipeline.status "${{ inputs.job_id }}" --state scene_ready \
            --message "Scene file ready. Download from the release." \
            --release-tag "$TARGET_RELEASE_TAG" \
            --set-json "$(cat jobs/${{ inputs.job_id }}/scene/export.json 2>/dev/null || echo '{}')"
          python -m pipeline.sync_job "${{ inputs.job_id }}"

      - name: Status — failed
        if: failure()
        run: |
          if [ -f "jobs/${{ inputs.job_id }}/scene/export.json" ] && [ -n "$(find work -name 'castcut-*.mp4' 2>/dev/null)" ]; then
            echo "::warning::Step failed after export succeeded; preserving scene_ready state"
            python -m pipeline.status "${{ inputs.job_id }}" --state scene_ready \
              --message "Scene file ready. Download from the release." \
              --set-json "$(cat jobs/${{ inputs.job_id }}/scene/export.json 2>/dev/null || echo '{}')"
          else
            python -m pipeline.status "${{ inputs.job_id }}" --state scene_failed \
              --message "Scene export failed; see workflow log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          python -m pipeline.sync_job "${{ inputs.job_id }}"

      - name: Status — cancelled
        if: cancelled()
        run: |
          prev=$(python -c "import json;print(json.load(open('jobs/${{ inputs.job_id }}/status.json')).get('state',''))" 2>/dev/null || true)
          python -m pipeline.status "${{ inputs.job_id }}" --state cancelled \
            --message "Run cancelled." --set-json "{\"cancelled_from\":\"$prev\"}" || true
          python -m pipeline.sync_job "${{ inputs.job_id }}"
