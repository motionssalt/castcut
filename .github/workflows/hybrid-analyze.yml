name: Hybrid Analysis (Faces + Scene)
run-name: "all analysis — ${{ inputs.job_id }}"
on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      content_type: { required: false, type: string, default: "" }
      sample_fps: { required: false, type: string, default: "2.0" }
permissions:
  contents: write
concurrency:
  group: castcut-analysis-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install CPU analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2
          python -m pip install -q requests opencv-python-headless pillow numpy onnxruntime faster-whisper
      - name: Install anime detector and embedder only for anime projects
        run: |
          kind=$(python -c "import json;print(json.load(open('jobs/${{ inputs.job_id }}/ingest-request.json'))['content_type'])")
          if [ "$kind" = "anime" ]; then python -m pip install -q dghs-imgutils; fi
      - name: Analyze and verify required release assets
        run: python -m pipeline.analyze "${{ inputs.job_id }}" --content-type "${{ inputs.content_type }}" --fps "${{ inputs.sample_fps }}" --repair all
      - name: Preserve funnel logs and sampling diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-diagnostics-${{ inputs.job_id }}
          path: |
            work/face_sampling.log
            jobs/${{ inputs.job_id }}/analysis/
            jobs/${{ inputs.job_id }}/clips/manifest.json
            work/sheets.json
